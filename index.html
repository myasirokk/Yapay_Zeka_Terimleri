<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>AI WORDS</title>
<link rel="icon" type="image/png" href="AIwordslogo.png">
<style>
:root{--bg:#f8fafc;--sf:#ffffff;--sf2:#f1f5f9;--ln:#e2e8f0;--ind:#4f46e5;--vio:#4f46e5;--tx:#0f172a;--mu:#475569;--ok:#10b981;--bad:#ef4444;--sh:0 1px 3px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.05)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,#e0e7ff 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;transition:padding .3s}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:700;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#4f46e5,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:.9rem}
button,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
.hb{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.bar{height:8px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#3b82f6);border-radius:99px;transition:width .5s ease}
.nav{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.nav h2{font-size:1.3rem;flex:1;min-width:0}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--sf2);transition:.2s}
.ib:hover:not(:disabled){border-color:var(--vio)}.ib:disabled{opacity:.35;cursor:default}
select{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
select option{background:var(--sf)}
.seg-row{display:flex;gap:3px}
.seg{flex:1;height:18px;background:none;padding:6px 0;position:relative}
.seg::after{content:"";display:block;height:6px;border-radius:3px;background:var(--sf2);transition:.25s}
.seg.done::after{background:var(--ok)}.seg.act::after{background:var(--vio);height:6px;box-shadow:0 0 8px var(--ind)}
.seg:hover::after{background:var(--ind)}
.stats{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mu);margin-bottom:6px;gap:10px;flex-wrap:wrap}
.cta{background:linear-gradient(135deg,#4f46e5,#3b82f6);padding:10px 18px;border-radius:10px;font-weight:600;transition:.2s}
.cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px #4f46e540}
.ghost{border:1px solid var(--ln);padding:8px 14px;border-radius:10px;transition:.2s;font-size:.92rem}
.ghost:hover{border-color:var(--vio)}
#bn{margin:16px 0}
.done-b{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--ok);background:#10b9811a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;transition:border-color .25s,box-shadow .25s}
.card:hover{border-color:var(--vio);box-shadow:0 10px 30px #4f46e522}
.card.ok{border-left:4px solid var(--ok)}
.ill{height:84px;border-radius:10px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);display:grid;place-items:center;margin-bottom:12px}
.ill svg{height:64px;width:120px;stroke:var(--vio);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.card:hover .ill svg{transform:translateY(-3px) scale(1.06)}
.ill .f{fill:var(--ind);stroke:var(--ind)}.ill .g{fill:#4f46e51f}
.cur{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.ch h3{font-size:1.05rem;line-height:1.3}
.ph{color:var(--vio);font-size:.88rem}
.card p{margin-top:8px;font-size:.92rem}
.ex{background:var(--sf2);border-left:3px solid var(--ind);padding:8px 12px;border-radius:0 8px 8px 0}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--ln);font-size:.86rem;transition:.2s;white-space:nowrap}
.acts button:hover{border-color:var(--vio)}
.acts .nb.has{color:var(--vio);border-color:var(--vio)}
.card.ok .lr{background:#10b98120;border-color:var(--ok);color:var(--ok)}
.pn{display:none}
#dr{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;background:var(--sf);border-left:1px solid var(--ln);transform:translateX(100%);transition:transform .3s ease;z-index:8;display:flex;flex-direction:column;padding:16px;box-shadow:-10px 0 40px rgba(15,23,42,.12)}
#dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#dc{overflow:auto;flex:1}
#dc h3{font-size:1rem}
textarea{width:100%;margin-top:10px;min-height:130px;resize:vertical;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;font-size:.92rem}
#nl h4{margin:18px 0 6px;font-size:.9rem;color:var(--mu)}
.ni{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;background:var(--sf2);margin-top:6px;font-size:.85rem}
.ni b{display:block}.ni span{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dro{padding-right:360px}
#test{position:fixed;inset:0;background:#f8fafcf7;display:none;overflow:auto;z-index:10;padding:20px 16px}
#test.on{display:block}
.tbox{max-width:680px;margin:0 auto}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:13px 15px;border-radius:10px;background:var(--sf);border:1px solid var(--ln);transition:.2s}
.opt:hover:not(:disabled){border-color:var(--vio);transform:translateX(3px)}
.opt.good{background:#10b98120;border-color:var(--ok)}.opt.wrong{background:#ef444418;border-color:var(--bad)}
.big{font-size:3rem;font-weight:800;margin:10px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--sf2);border:1px solid var(--vio);padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;font-size:.9rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){#dr{top:auto;width:100%;height:55vh;border-left:0;border-top:1px solid var(--ln);border-radius:16px 16px 0 0;transform:translateY(100%)}body.dro{padding-right:0;padding-bottom:55vh}.grid{grid-template-columns:1fr}}
@media print{:root{--bg:#fff;--sf:#fff;--sf2:#f3f3f8;--ln:#bbb;--tx:#000;--mu:#444;--vio:#4338ca}body{background:#fff;padding:0!important}.acts,#dr,#test,.hb,.nav button,.nav select,#bn,.seg-row,#toast{display:none!important}.card{break-inside:avoid}.pn{display:block;border-top:1px dashed #999;padding-top:6px;font-style:italic}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.panel,.card{box-shadow:var(--sh)}.cta{color:#fff}select{max-width:190px}.nav h2 small{display:block;font-size:.8rem;font-weight:500;color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>30 Günde <span>AI Terimleri</span></h1>
      <p class="sub">Muhammed Yasir OK</p>
    </div>
    <div class="hb">
      <button class="ghost" id="nbtn">📝 Not Defteri</button>
      <button class="ghost" id="print">🖨 Yazdır</button>
      <button class="ghost" id="reset">Sıfırla</button>
    </div>
  </header>
  <section class="panel">
    <div class="stats"><span id="st1"></span><span id="st2"></span></div>
    <div class="bar"><i id="bgAll"></i></div>
    <div class="nav">
      <button class="ib" id="pd" aria-label="Önceki gün">‹</button>
      <h2 id="dt"></h2>
      <select id="dsel" aria-label="Gün seç"></select>
      <button class="ib" id="nd" aria-label="Sonraki gün">›</button>
    </div>
    <div class="seg-row" id="seg"></div>
  </section>
  <div id="bn"></div>
  <main id="main" class="grid"></main>
</div>
<aside id="dr" aria-label="Not defteri"><div class="dh"><b>📝 Not Defteri</b><button class="ib" id="drx" aria-label="Kapat">✕</button></div><div id="dc"></div></aside>
<div id="test"><div class="tbox" id="tbox"></div></div>
<div id="toast" role="status"></div>

["Veri Mühendisliği","db",["ETL|i-ti-el|Veriyi çekip dönüştürüp hedefe yükleme süreci|Satış verisini depoya taşımak","Data Pipeline|dey-ta payp-layn|Verinin kaynaktan hedefe akışını otomatikleştiren hat|Günlük otomatik yükleme","Data Warehouse|dey-ta ver-haus|Analiz için düzenlenmiş merkezi veri deposu|BigQuery, Snowflake","Batch Processing|beç pro-se-sing|Veriyi toplu halde belirli aralıklarla işleme|Gece raporu üretmek","Streaming|stri-ming|Veriyi anlık akış halinde işleme|Kafka ile canlı olaylar"]],
["AI Güvenliği & Etik","lock",["Bias|bay-ıs|Modelin eğitim verisinden gelen haksız eğilimi|Belirli gruba düşük puan vermek","Prompt Injection|prompt in-cek-şın|Zararlı girdiyle modelin talimatlarını ele geçirme|Belgeye gizli komut yazmak","Guardrails|gard-reylz|Modelin çıktısını güvenli sınırlarda tutan kurallar|Zararlı içeriği engellemek","Alignment|ı-layn-mınt|Modelin insan değer ve niyetleriyle uyumlu davranması|Zararsız ve yardımcı olmak","Explainability|iks-pleyn-ı-bi-li-ti|Model kararının nedenini açıklayabilme|Neden reddedildiğini göstermek"]],
["Performans & Ölçek","gear",["Scalability|skey-lı-bi-li-ti|Sistemin yük arttıkça büyüyebilme yeteneği|Kullanıcı 10 katına çıksa da çalışmak","Quantization|kvan-ti-zey-şın|Model sayılarını düşük hassasiyete çevirip küçültme|16 bitten 4 bite","Batching|beç-ing|Birden çok isteği birlikte işleyerek verim artırma|8 isteği tek seferde çalıştırmak","Throughput|thru-put|Birim sürede işlenen iş miktarı|Saniyede 100 istek","Profiling|pro-fay-ling|Kodun zaman ve bellek harcadığı yerleri ölçme|Yavaş fonksiyonu bulmak"]],
["Takım Pratikleri","gear",["Agile|e-cayl|Kısa döngülerle esnek ve iteratif geliştirme yaklaşımı|2 haftalık sprintler","Scrum|skram|Sprint ve rollerle işleyen çevik çerçeve|Günlük stand-up toplantısı","Code Review|kod ri-vyu|Kodun birleştirilmeden önce ekipçe incelenmesi|PR üzerinde yorum yazmak","Technical Debt|tek-ni-kıl det|Hızlı çözümlerin sonradan getirdiği bakım maliyeti|Geçici kodu temizlememek","Documentation|do-kyu-men-tey-şın|Kodun nasıl kullanılacağını anlatan yazılı kaynak|README dosyası"]]
];
const CAT=[null,"Yazılım Temelleri"];
const ACR=/^(SSH|DNS|HTTPS|CDN|CNN|GPU|NLP|MCP|ETL|LLM|SQL|API|npm|DOM)$/,SAY={JSON:'Jason',MLOps:'M L Ops',LoRA:'Lora',SOLID:'Solid'};
RAW.forEach((r,k)=>{const d=k+2;CAT[d]=r[0];
  DAYS[d]=r[2].map(x=>{const[n,p,ds,e]=x.split('|');let b=n.replace(/\s*\(.*\)/,'').replace('/',' ');
    return{n,p,s:SAY[b]||(ACR.test(b)?b.split('').join(' '):b),g:ICONS[r[1]],d:ds,e}})});
/* Hazır soru yoksa: "Terim ne anlama gelir?" + aynı günün diğer açıklamalarından şıklar */
function mkQ(t){
  if(t.q)return{q:t.q,a:t.a,o:shuffle([t.a,...t.w])};
  const same=terms(S.cur).filter(x=>x!==t).map(x=>x.d);
  const all=Object.values(DAYS).flat().map(x=>x.d).filter(x=>x!==t.d&&!same.includes(x));
  const dist=shuffle(same).slice(0,3);
  while(dist.length<3)dist.push(shuffle(all).pop());
  return{q:'"'+t.n+'" ne anlama gelir?',a:t.d,o:shuffle([t.d,...dist])};
}

/* ===== DURUM ===== */
const $=s=>document.querySelector(s);
let S={cur:0,learned:{},notes:{},scores:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('terim30v2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('terim30v2',JSON.stringify(S))}catch(e){}};
const terms=d=>DAYS[d]||[];
const lcount=d=>Object.keys(S.learned[d]||{}).length;
const done=d=>terms(d).length>0&&lcount(d)>=terms(d).length;
const sug=()=>{for(let d=1;d<=30;d++)if(!done(d))return d;return 30};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const nk=(d,i)=>d+'-'+i;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
if(!S.cur)S.cur=sug();

/* ===== SESLİ TELAFFUZ: en doğal en-US sesini seç ===== */
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!vs.length)return;
  const score=v=>{let s=0;const n=v.name;
    if(/natural|neural|online/i.test(n))s+=60;
    if(/google (us|uk)|samantha|aria|jenny|guy|ava|allison|serena|daniel|zira/i.test(n))s+=30;
    if(/^en[-_]US$/i.test(v.lang))s+=20;else if(/^en[-_]GB$/i.test(v.lang))s+=12;
    if(!v.localService)s+=5;return s};
  voice=vs.slice().sort((a,b)=>score(b)-score(a))[0];
}
function speak(t){
  if(!('speechSynthesis' in window))return toast('Tarayıcın sesli okumayı desteklemiyor.');
  if(!voice)pickVoice();
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;
  u.rate=.9;u.pitch=1;u.volume=1;
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

/* ===== ARAYÜZ ===== */
function renderTop(){
  const d=S.cur,T=terms(d);
  let tot=0,days=0,all=0;for(let k=1;k<=30;k++){tot+=lcount(k);all+=terms(k).length;if(done(k))days++}
  $('#st1').textContent=`${days}/30 gün tamamlandı`;
  $('#st2').textContent=`${tot}/${all} kelime öğrenildi`;
  $('#bgAll').style.width=(tot/all*100)+'%';
  $('#dt').innerHTML=`${d}. Gün<small>${esc(CAT[d])}</small>`;
  let s='',o='';
  for(let k=1;k<=30;k++){
    s+=`<button class="seg${k===d?' act':''}${done(k)?' done':''}" data-d="${k}" aria-label="${k}. gün"></button>`;
    o+=`<option value="${k}"${k===d?' selected':''}>${k}. Gün · ${CAT[k]}${done(k)?' ✓':''}</option>`;
  }
  $('#seg').innerHTML=s;$('#dsel').innerHTML=o;
  $('#pd').disabled=d<=1;$('#nd').disabled=d>=30;
  const c=lcount(d);
  $('#bn').innerHTML=!T.length?'':done(d)
    ?`<div class="panel done-b"><span>🎉 ${d}. gün tamamlandı! ${T.length} terimi öğrendin.</span><span class="hb"><button class="ghost" id="bt">Günün Testi</button>${d<30?'<button class="cta" id="gn">Sonraki güne geç →</button>':''}</span></div>`
    :`<div class="panel"><div class="stats"><span>Bu gün: ${c}/${T.length} terim</span><span>${d<30?`${T.length-c} terim sonra ${d+1}. gün`:''}</span></div><div class="bar"><i style="width:${c/T.length*100}%"></i></div></div>`;
}
function renderCards(){
  const d=S.cur,T=terms(d);
  if(!T.length){
    $('#main').innerHTML=`<div class="panel" style="grid-column:1/-1"><p>${d}. gün için henüz terim eklenmedi. Kodun başındaki <b>DAYS</b> nesnesine şu şablonla 20 terim ekle:</p><pre style="white-space:pre-wrap;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-top:10px;font-size:.82rem;color:var(--vio);overflow:auto">${esc(TEMPLATE.replace('DAYS[2]','DAYS['+d+']'))}</pre></div>`;return;
  }
  $('#main').innerHTML=T.map((t,i)=>{
    const L=!!(S.learned[d]||{})[i],note=S.notes[nk(d,i)]||'';
    return `<article class="card${L?' ok':''}" data-i="${i}">
      <div class="ill"><svg viewBox="0 0 120 64" aria-hidden="true">${t.g||''}</svg></div>
      <div class="ch"><h3>${esc(t.n)}</h3><span class="ph">Okunuş: ${esc(t.p)}</span></div>
      <p><b>Ne işe yarar:</b> ${esc(t.d)}</p>
      ${t.e?`<p class="ex"><b>Örnek:</b> ${esc(t.e)}</p>`:''}
      <p class="pn">${esc(note)}</p>
      <div class="acts"><button class="spk" aria-label="${esc(t.n)} telaffuzunu dinle">🔊 Dinle</button><button class="nb${note.trim()?' has':''}">📝 Not</button><button class="lr">${L?'✓ Öğrendim':'Öğrendim'}</button></div>
    </article>`;
  }).join('');
}
function render(){renderTop();renderCards()}
function go(d){S.cur=Math.max(1,Math.min(30,d));save();render();window.scrollTo({top:0,behavior:'smooth'})}

/* ===== NOT DEFTERİ (yan panel) ===== */
let dr=null;
function listNotes(){
  const ks=Object.keys(S.notes).filter(k=>S.notes[k].trim());
  $('#nl').innerHTML=ks.length?'<h4>Tüm notlarım</h4>'+ks.map(k=>{const[d,i]=k.split('-').map(Number),t=terms(d)[i];return t?`<button class="ni" data-d="${d}" data-i="${i}"><b>${esc(t.n)} · ${d}. gün</b><span>${esc(S.notes[k])}</span></button>`:''}).join(''):'<h4>Henüz not yok. Bir kartta “📝 Not”a bas.</h4>';
}
function openNote(d,i){
  dr=d?{d,i}:null;
  const t=dr&&terms(d)[i];
  $('#dc').innerHTML=(t?`<h3>${esc(t.n)}</h3><p class="sub">${d}. gün · notun otomatik kaydedilir</p><textarea id="nt" placeholder="Bu terim hakkındaki notun..."></textarea>`:'')+'<div id="nl"></div>';
  if(t)$('#nt').value=S.notes[nk(d,i)]||'';
  listNotes();
  $('#dr').classList.add('on');document.body.classList.add('dro');
  if(t)$('#nt').focus();
}
function closeNote(){$('#dr').classList.remove('on');document.body.classList.remove('dro')}
document.addEventListener('input',e=>{
  if(e.target.id!=='nt'||!dr)return;
  const v=e.target.value;S.notes[nk(dr.d,dr.i)]=v;save();listNotes();
  if(dr.d===S.cur){const c=document.querySelector(`.card[data-i="${dr.i}"]`);
    if(c){c.querySelector('.nb').classList.toggle('has',!!v.trim());c.querySelector('.pn').textContent=v}}
});

/* ===== TEST ===== */
let T=null;
function startTest(){
  T={qs:shuffle(terms(S.cur)).map(mkQ),i:0,ok:0,day:S.cur};
  $('#test').classList.add('on');showQ();
}
function showQ(){
  const q=T.qs[T.i],n=T.qs.length;
  $('#tbox').innerHTML=`<div class="stats"><span>Soru ${T.i+1}/${n}</span><button class="ghost" id="quit">Çık</button></div><div class="bar"><i style="width:${T.i/n*100}%"></i></div>
  <h2 style="margin:22px 0 6px">${esc(q.q)}</h2>${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}<div id="nx"></div>`;
}
function finish(){
  const pct=Math.round(T.ok/T.qs.length*100),pass=pct>=70,d=T.day;
  if(pct>(S.scores[d]||0))S.scores[d]=pct;save();
  $('#tbox').innerHTML=`<div class="panel" style="text-align:center"><p class="sub">Test sonucu</p><div class="big" style="color:${pass?'var(--ok)':'var(--bad)'}">%${pct}</div>
  <p>${T.ok}/${T.qs.length} doğru · ${pass?'Başarılı':'Biraz daha tekrar iyi olur'}</p>
  <div class="hb" style="justify-content:center;margin-top:20px"><button class="ghost" id="retry">Testi tekrarla</button><button class="cta" id="close">Kapat</button></div></div>`;
}

/* ===== OLAYLAR ===== */
document.addEventListener('click',e=>{
  const c=s=>e.target.closest(s);let el;
  if(el=c('.seg'))return go(+el.dataset.d);
  if(c('#pd'))return go(S.cur-1);
  if(c('#nd')||c('#gn'))return go(S.cur+1);
  if(c('#bt'))return startTest();
  if(c('#nbtn'))return openNote(null);
  if(c('#drx'))return closeNote();
  if(c('#print'))return window.print();
  if(c('#reset')){if(confirm('Tüm ilerleme, not ve test sonuçları silinecek. Emin misin?')){S={cur:1,learned:{},notes:{},scores:{}};save();closeNote();render();toast('İlerleme sıfırlandı.')}return}
  if(el=c('.ni')){const d=+el.dataset.d,i=+el.dataset.i;S.cur=d;save();render();openNote(d,i);const k=document.querySelector(`.card[data-i="${i}"]`);if(k)k.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(el=c('.card')){
    const i=+el.dataset.i,d=S.cur,t=terms(d)[i];
    if(c('.spk'))return speak(t.s||t.n);
    if(c('.nb'))return openNote(d,i);
    if(c('.lr')){
      S.learned[d]=S.learned[d]||{};
      const was=done(d);
      if(S.learned[d][i])delete S.learned[d][i];else S.learned[d][i]=1;
      save();el.classList.toggle('ok',!!S.learned[d][i]);
      c('.lr').textContent=S.learned[d][i]?'✓ Öğrendim':'Öğrendim';
      renderTop();
      if(!was&&done(d))toast(`🎉 ${d}. gün tamamlandı!`);
    }
    return;
  }
  if(!T)return;
  if(c('#quit')||c('#close')){T=null;$('#test').classList.remove('on');renderTop();return}
  if(c('#retry'))return startTest();
  if(c('#tn')){T.i++;T.i<T.qs.length?showQ():finish();return}
  if((el=c('.opt'))&&!el.disabled){
    const q=T.qs[T.i],pick=q.o[+el.dataset.k];
    if(pick===q.a)T.ok++;
    document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(q.o[+b.dataset.k]===q.a)b.classList.add('good')});
    if(pick!==q.a)el.classList.add('wrong');
    $('#nx').innerHTML=`<button class="cta" id="tn" style="margin-top:16px">${T.i+1<T.qs.length?'Sonraki soru':'Sonucu gör'}</button>`;
    $('#tn').focus();
  }
});
$('#dsel').addEventListener('change',e=>go(+e.target.value));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNote();if(T){T=null;$('#test').classList.remove('on')}}});

render();
</script>

<script>
(function(){
  var ENDPOINT='/api/chat', hist=[], busy=false, lastSend=0;

  root.innerHTML=
   '<button class="aiw-btn" id="aiwBtn" aria-expanded="false" aria-controls="aiwPanel">🤖 AI Asistan</button>'+
   '<section class="aiw-panel" id="aiwPanel" role="dialog" aria-label="AI Asistan">'+
     '<div class="aiw-head"><div>AI Asistan<small>Terimler ve yazılım soruları için</small></div><button class="aiw-x" id="aiwX" aria-label="Kapat">✕</button></div>'+
     '<div class="aiw-log" id="aiwLog" aria-live="polite"></div>'+
     '<form class="aiw-form" id="aiwForm"><textarea class="aiw-in" id="aiwIn" rows="1" maxlength="1000" placeholder="Bir soru yaz..." aria-label="Mesajın"></textarea><button class="aiw-send" id="aiwSend" type="submit">Gönder</button></form>'+
     '<div class="aiw-note">Yapay zeka hata yapabilir; önemli bilgileri doğrula. Mesajların ve ilerleme özetin yanıt üretmek için Google Gemini\'ye gönderilir. Notların gönderilmez.</div>'+
   '</section>';
  document.body.appendChild(root);
  var $=function(id){return document.getElementById(id)};
  var panel=$('aiwPanel'), log=$('aiwLog'), input=$('aiwIn'), sendBtn=$('aiwSend');

  function context(){
    try{
      var S=JSON.parse(localStorage.getItem('terim30v2')||'{}'), cur=+S.cur||1, L=S.learned||{}, sc=S.scores||{};
      var lc=function(d){return Object.keys(L[d]||{}).length};
      var hasT=typeof terms==='function', total=0, done=0;
      for(var d=1;d<=30;d++){var c=lc(d);total+=c;var n=hasT?terms(d).length:20;if(n&&c>=n)done++}
      var o={day:cur,doneDays:done,learnedTotal:total,learnedToday:lc(cur)};
      if(typeof CAT!=='undefined'&&CAT[cur])o.category=CAT[cur];
      if(hasT)o.todayTerms=terms(cur).map(function(t){return t.n});
      if(sc[cur]!=null)o.todayBestScore=sc[cur];
      return o;
    }catch(e){return {}}
  }

  function md(t){
    return String(t).split(/(```[\s\S]*?```)/g).map(function(seg){
      var h=seg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if(/^```/.test(h)) return '<pre><code>'+h.replace(/^```[\w-]*\n?/,'').replace(/```$/,'')+'</code></pre>';
      return h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
    }).join('');
  }
  function add(role,text,html){
    var m=document.createElement('div'); m.className='aiw-m '+role;
    if(html) m.innerHTML=text; else m.textContent=text;
    log.appendChild(m); log.scrollTop=log.scrollHeight; return m;
  }
  function chips(){
    var w=document.createElement('div'); w.className='aiw-chips';
    ['Bugünkü terimleri kısaca özetle','Git ile GitHub farkı nedir?','Şu an saat kaç?'].forEach(function(q){
      var b=document.createElement('button'); b.type='button'; b.className='aiw-chip'; b.textContent=q;
      b.onclick=function(){w.remove();send(q)}; w.appendChild(b);
    });
    log.appendChild(w);
  }
  function setBusy(v){busy=v;sendBtn.disabled=v;input.disabled=v;if(!v)input.focus()}

  async function send(text){
    text=(text||'').trim();
    if(!text||busy)return;
    if(Date.now()-lastSend<1500)return;
    lastSend=Date.now();
    var old=log.querySelector('.aiw-chips'); if(old)old.remove();
    add('u',text); hist.push({role:'user',content:text}); if(hist.length>20)hist=hist.slice(-20);
    input.value=''; input.style.height='auto'; setBusy(true);
    var wait=add('b','<span class="aiw-dots"><span></span><span></span><span></span></span>',true);
    try{
      var r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        messages:hist.slice(-8), context:context(), clientTime:new Date().toString(),
        timeZone:(Intl.DateTimeFormat().resolvedOptions().timeZone||'')
      })});
      var j={}; try{j=await r.json()}catch(e){}
      if(!r.ok||!j.reply) throw new Error(j.error||'Bir hata oluştu, tekrar dene.');
      wait.innerHTML=md(j.reply); hist.push({role:'assistant',content:j.reply});
    }catch(e){
      wait.textContent=(e instanceof TypeError)?'Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.':e.message;
      wait.classList.add('err'); hist.pop();
    }
    setBusy(false); log.scrollTop=log.scrollHeight;
  }

  function toggle(open){
    panel.classList.toggle('open',open); $('aiwBtn').setAttribute('aria-expanded',open);
    if(open){
      if(!log.children.length){add('b','Merhaba! Terimler, yazılım ve yapay zeka hakkında soru sorabilirsin.');chips()}
      setTimeout(function(){input.focus()},200);
    }
  }
  $('aiwBtn').onclick=function(){toggle(!panel.classList.contains('open'))};
  $('aiwX').onclick=function(){toggle(false)};$('aiwForm').addEventListener('submit',function(e){e.preventDefault();send(input.value)});
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input.value)}});
  input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});
})();
</script>
</html>
